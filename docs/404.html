<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b46">
  <title>AFS Karte · Seite nicht gefunden</title>
  <script>
    (function(){
      var path = location.pathname;
      var retMatch = path.match(/^(.*\/)[^/]+\/returnees\/?$/i);
      if (retMatch) {
        location.replace(location.origin + retMatch[1] + 'returnees/' + location.search + location.hash);
        return;
      }
      var contactMatch = path.match(/^(.*\/)[^/]+\/Kontaktformular\/?$/i);
      if (contactMatch) {
        location.replace(location.origin + contactMatch[1] + 'Kontaktformular/' + location.search + location.hash);
        return;
      }
    })();
  </script>
</head>
<body class="returnees-page">
  <main style="max-width:600px;margin:80px auto;text-align:center;font-family:system-ui,-apple-system,sans-serif;padding:0 20px;">
    <h1>Seite nicht gefunden</h1>
    <p>Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
    <p><a href="./" id="home-link">Zur Startseite</a> · <a href="returnees/" id="returnees-link">Zu den Returnees</a></p>
  </main>
  <script>
    (function(){
      var match = location.pathname.match(/^(\/[^/]+\/)/);
      var root = match ? match[1] : '/';
      var h = document.getElementById('home-link');
      var r = document.getElementById('returnees-link');
      if (h) h.href = root;
      if (r) r.href = root + 'returnees/';
    })();
  </script>
</body>
</html>
